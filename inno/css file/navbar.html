<html>
    <head>
        <title>Navbar</title>
    </head>
    <style>
        #box{
            background-color: #607456;
            border-color: red;
            border-radius: 5px;
            margin: 10px;
            padding: 50px;
        }
        h1{
            border-radius: 10px;
            color: bisque;
        }
        a{
            text-decoration: none;
            background-color: antiquewhite;
            margin: 10px;
            padding: 5px;
            border-radius: 2px;
            color: #000;
        }
        #text-box{
            margin-left: 550px;
            padding: 5px;
            border: 2px solid red;
        }
        #search{
            background-color: #F7F1DE;
            color: #607456;
        }
    </style>
    <body>
        <nav id="box">
            <h1>Innomatics</h1>
            <a href="home.html">Home</a>
            <a href="home.html">Course</a>
            <a href="home.html">Fees</a>
            <a href="home.html">About</a>
            <a href="home.html">Account</a>
            <input type="text" placeholder="Search the course" id="text-box">
            <input type="submit" placeholder="Search Here" value="Search Here" id="Search">
        </nav>
    </body>
</html>

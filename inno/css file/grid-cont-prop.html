<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grid Container Properties</title>
    <style>
        .container{
            height: 100vh;
            grid-template-columns: repeat(3,1fr);
            display: grid;
            /* justify-items: right;
            align-items: top; */
            justify-content: center;

        }
        .box{
            height: 100px;
            width: 100px;
            background-color: rgb(111, 199, 199);
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Hero1</div>
        <div class="box">Hero2</div>
        <div class="box">Hero3</div>
        <div class="box">Hero4</div>
        <div class="box">Hero5</div>
    </div>
</body>
</html>

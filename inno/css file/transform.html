<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 50vh;
            width: 50vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            gap:20px
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: rgb(206, 153, 84);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 3s;
            
        }
        .box1:hover{
            transform: translateX(-50px);
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: rgb(142, 222, 135);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 3s;
            
        }
        .box2:hover{
            transform: translateY(50px);
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: rgb(112, 179, 193);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 3s;
        }
        .box3:hover{
            transform: translate(50px,50px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Hero1</div>
        <div class="box2">Hero2</div>
        <div class="box3">Hero3</div>
    </div>
</body>
</html>

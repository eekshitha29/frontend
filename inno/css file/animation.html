<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Animation</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 300px;
            height: 600px;
            border: 2px solid black;
            background-color: rgb(247, 240, 231);
            display: flex;
            justify-content: center;
            

        }
        .ball{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: rgb(217, 239, 150);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            animation-name: bouncing-ball;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation: name duration timing-function delay iteration-count direction fill-mode;
        }
        /* @keyframes bouncing-ball{
            from{
                transform: translateY(0px) rotate(0)
            }
            to{
                transform: translateY(500px) rotate(5turn)
            }
        } */

        @keyframes bouncing-ball{
            0%{
                transform: translateY(0px) rotate(0)
            }
            50%{
                background-color: rgb(209, 160, 86);
            }
            100%{
                transform: translateY(500px) rotate(5turn)
            }
        }
    </style>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <div class="container">
        <div class="ball">Ball</div>
    </div>
</body>
</html>

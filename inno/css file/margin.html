<html>
    <head>
        <title>Margin</title>
        <style>
            #box1{
                height: 200px;
                width: 200px;
                background-color: #86BCBD;
                color: #fff;
                border: 3px solid #F7E49B;
                margin-top: 10px;
                margin-right: 50px;
                margin-bottom: 50px;
                margin-left: 100px;
            }
            #box2{
                height: 200px;
                width: 200px;
                background-color: #428475;
                color: #89d7b7;
                border: 3px dotted #1A312C;
                margin-right: 60px;
            }
            #box3{
                height: 200px;
                width: 200px;
                background-color: #F7F1DE;
                color: #1A312C;
                border: 10px dashed #B0BA99;
                margin-left: 25px;
            }
            #box4{
                height: 200px;
                width: 200px;
                background-color: #B0BA99;
                color: #1A312C;
                border: 3px groove #1A312C;
                margin-top: 50px;
            }
        </style>
    </head>
    <body>
        <div id="box1">
            Hero
        </div>
        <span id="box2">
            Hero
        </span>
        <span id="box3">
            Hero
        </span>
        <div id="box4">
            Hero
        </div>
    </body>
</html>

<html>
    <head>
        <title>Display</title>
    </head>
    <style>
        div{
            height: 100px;
            width: 100px;
            display: inline;
        }
        span{
            height: 100px;
            width: 100px;
            display: block;
        }
        
        #box1{
            background-color: rgb(214, 195, 148);
        }
        #box2{
            background-color: rgb(99, 180, 153);
            display: none;
        }
        #box3{
            background-color: rgb(66, 134, 157);
            visibility: hidden;
        }
        #box4{
            background-color: rgb(211, 216, 72);
        }
    </style>
    <body>
        <h1>Changing Block level element into Inline element</h1>
        <div id="box1">Hero</div>
        <div id="box2">Zero</div>
        <h1>Changing Inline level element into Block element</h1>
        <span id="box1">Hero1</span>
        <span id="box2">Hero2</span>
        <span id="box3">Hero3</span>
        <span id="box4">Hero4</span>
    </body>
</html>

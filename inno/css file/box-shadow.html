<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Box Shadow</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            border: 2px;
            background-color: red;
            color: yellow;
            box-shadow: 10px 10px 5px 5px green inset;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <div>Hero</div>
</body>
</html>

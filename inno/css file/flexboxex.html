<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Flex Box Task</title>
    <style>
        div{
            border-radius: 50%;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        #circle1{
            background-color: #FFE97D;
            height: 200px;
            width: 200px;  
        }
        #circle2{
            background-color: #BBD5DA;
            height: 150px;
            width: 150px;
        }
        #circle3{
            background-color: #9CB080;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div id="circle1">
    <div id="circle2">
    <div id="circle3" align="center">
        <p>Full Stack Developer</p>
    </div>
    </div>
    </div>
</body>
</html>

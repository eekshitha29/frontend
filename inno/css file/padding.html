<html>
    <head>
        <title>Padding</title>
        <style>
            #box1{
                height: 200px;
                width: 200px;
                background-color: #86BCBD;
                color: #fff;
                border: 3px solid #F7E49B;
                padding-top: 10px;
                padding-right: 50px;
                padding-bottom: 50px;
                padding-left: 100px;
            }
            #box2{
                height: 200px;
                width: 200px;
                background-color: #428475;
                color: #89d7b7;
                border: 3px dotted #1A312C;
                padding: 20px 25px 30px;
            }
            #box3{
                height: 200px;
                width: 200px;
                background-color: #428475;
                color: #1A312C;
                border: 3px groove #1A312C;
                padding: 20px 25px;
            }
            #box4{
                height: 200px;
                width: 200px;
                background-color: #428475;
                color: #1A312C;
                border: 3px groove #1A312C;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div id="box1">
            Hero
        </div>
        <div id="box2">
            Hero
        </div>
        <div id="box3">
            Hero
        </div>
        <div id="box4">
            Hero
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Position</title>
    <style>
        div{
            border: 2px solid green;
            position: absolute;

        }
        #box1{
            background-color: rgb(170, 187, 202);
            height: 200px;
            width: 200px;

        }
        #box2{
            background-color: rgb(174, 126, 170);
            height: 150px;
            width: 150px;
        }
        #box3{
            background-color: rgb(105, 182, 104);
            height: 100px;
            width: 100px;
        }
        
    </style>
    <link rel='stylesheet' href='main.css'>
</head>
<body>

        <div id="box1">Hero1</div>
        <div id="box2">Hero2</div>
        <div id="box3">Hero3</div>

</body>
</html>

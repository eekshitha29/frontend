<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio,Video,Iframe</title>
</head>
<body>
    <h1>Audio Example</h1>
    <audio controls loop muted autoplay>
        <source src="mymusic.mp3" type="audio/mp3">
    </audio>0
    <h1>Video Example</h1>
    <video controls height="200px" loop muted poster="waterfalls.jpg">
        <source src="video.crdownload" type="video/mp4">
    </video>
    <h1>iframe Example</h1>
    <h3>My webpage- wikipedia</h3>
    <iframe src="https://www.wikipedia.org/" height="500px" width="800px" scrolling="no"></iframe>
    <h3>My webpage- Google</h3>
    <iframe src="https://www.google.com/"></iframe>
    <h3>Youtube Example</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/sAsjYSO6iZM?si=nbITWCu74I7BzQpz"
    allowfullscreen frameborder="1"></iframe>
    <h3>Maps</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d60887.389409850686!2d78.39237929918211!3d17.4854536145786!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1781162630034!5m2!1sen!2sin"
     width="600" height="450" style="border:0;" allowfullscreen="">
    </iframe>
</body>
</html>

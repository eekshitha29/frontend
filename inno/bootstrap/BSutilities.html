<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Text-Properties Using bootstrap Utilities</h1>
    <!-- Text-align with Bootstrap -->
    <h3 class="text-center text-danger bg-warning">Hero</h3>
    <!-- Text transform with Bootstrap -->
    <p class="text-uppercase">Full Stack Experts</p>
    <!-- Font-Size -->
    <p class="fs-1">zero</p>
    <!-- font-Weight -->
    <p class="fw-bold">Innomatics</p>
    <!-- Text-decoration -->
    <p class="text-decoration-underline">Full Stack Academy</p>
    <div class="bg-success text-center fs-1 m-5 pt-5" style="height: 100px; width: 100px;">Box1</div>
    <div class="bg-danger text-center fs-4 ms-2 p-3" style="height: 100px; width: 100px;">Box2</div>
    <div class="border border-4 mt-2" style="height: 100px; width: 100px;">Hello</div>
    <div class="border border-top-0 mt-2" style="height: 100px; width: 100px;">Hero</div>
    <div class="border border-info mt-2" style="height: 100px; width: 100px;">hehe</div>
    <div class="border border-info-subtle mt-2" style="height: 100px; width: 100px;">haha</div>
    <h1>Display Behaviour</h1>
    <div class="d-inline p-2 text-bg-primary">d-inline</div>
    <div class="d-inline-block p-2 text-bg-dark">d-inline-block</div>
    <div class="d-block p-2 text-bg-primary">d-block</div>
    <div class="d-none p-2 text-bg-dark">d-none</div>
    <div class="d-flex flex-column mb-3">
        <div class="p-2 bg-primary">Flex-item 1</div>
        <div class="p-2 bg-primary">Flex-item 2</div>
        <div class="p-2 bg-primary">Flex-item 3</div>
    </div>
    <div class="d-flex flex-column-reverse justify-content-center align-items-center mb-3" style="height: 100px;">
        <div class="p-2 bg-primary">Flex-item 1</div>
        <div class="p-2 bg-primary">Flex-item 2</div>
        <div class="p-2 bg-primary">Flex-item 3</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>

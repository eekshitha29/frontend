<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grid System</title>
    <link rel='stylesheet' href='main.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Grid System</h1>
    <div class="container-fluid bg-primary">
        <div class="row">
            <div class="col bg-info">Column1</div>
            <div class="col bg-warning">Column2</div>
            <div class="col bg-success">Column3</div>
            <div class="col bg-danger">Column4</div>
        </div>
        <div class="row bg-secondary">
            <div class="col-3 bg-success">Column1</div>
            <div class="col-4 bg-danger">Column2</div>
            <div class="col-3 bg-info">Column3</div>
            <div class="col-6 bg-warning">Column2</div>
        </div>
        <div class="row bg-secondary">
            <div class="col-sm-7 col-md-4 col-lg-4 bg-danger">Column1</div>
            <div class="col-sm-7 col-md-4 col-lg-4 bg-warning">Column2</div>
            <div class="col-sm-7 col-md-12 col-lg-4 bg-success">Column3</div>
        </div>
    </div>
    <div class="container px-4 text-center">
  <div class="row gx-5">
    <div class="col bg-warning">
      <div class="p-3">Custom column padding</div>
    </div>
    <div class="col bg-primary">
      <div class="p-3">Custom column padding</div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
